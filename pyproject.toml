[project]
name = "bico"
version = "2.0"
description = "Binary Converter for converting ETH eddy covariance binary raw data to ASCII CSV files"
authors = [
    { name = "Lukas Hörtnagl", email = "31772692+holukas@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0,<2.0",
    "pytz>=2024.1",
    "matplotlib>=3.8.0",
    "textual>=0.86.0",
]

[project.scripts]
bico = "bico.bico:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bico"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: deselected by default; run with `-m slow` (e.g. the reference comparisons)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["bico/settings/data_blocks"]

[tool.ruff.lint]
# Start conservative: pyflakes (F) and a subset of pycodestyle (E) errors.
# Widen the selection over time once the codebase is clean.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
]
