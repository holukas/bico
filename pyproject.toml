[project]
name = "bico"
version = "2.0"
description = "Binary Converter for converting ETH eddy covariance binary raw data to ASCII CSV files"
authors = [
    { name = "Lukas Hörtnagl", email = "31772692+holukas@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0,<2.0",
    "pytz>=2024.1",
    "matplotlib>=3.8.0",
    "pyqt5>=5.15.10",
    "pyqt5-qt5>=5.15.2",
]

[tool.uv]
# bico is run as an application (`python src/bico.py`), not installed as a
# package, so uv should manage the environment without building the project.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
